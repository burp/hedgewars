# .github/workflows/ci.yml
name: CI

on:
  push:
    branches:
      - master
      - 'test-*'
      - 'ci-*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build:
    name: osx/clang/${{ matrix.build_args }}
    runs-on: macos-14

    strategy:
      fail-fast: false
      matrix:
        build_args:
          - "-DNOSERVER=1 -DLUA_SYSTEM=0"

    env:
      CC: clang
      CXX: clang++
      
      # Set BUILD_ARGS for the job
      BUILD_ARGS: ${{ matrix.build_args }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Before Install (macOS)
        run: brew update

      - name: Cache Homebrew Downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/Homebrew
            /Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      - name: Cache SDL2 Frameworks
        uses: actions/cache@v6
        with:
          path: ~/Library/Frameworks
          key: ${{ runner.os }}-sdl2-frameworks-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Dependencies (macOS)
        run: |
          rm -f /usr/local/bin/openssl /opt/homebrew/bin/openssl || true
          brew unlink openssl@1.1 || true
          brew install --overwrite qt6 fpc glew physfs lua ffmpeg 7zip libvorbis libogg

          mkdir -p $HOME/Library/Frameworks
          bash ./tools/dmg_to_framework.sh https://github.com/libsdl-org/SDL/releases/download/release-2.32.10/SDL2-2.32.10.dmg
          bash ./tools/dmg_to_framework.sh https://github.com/libsdl-org/SDL_image/releases/download/release-2.8.8/SDL2_image-2.8.8.dmg
          bash ./tools/dmg_to_framework.sh https://github.com/libsdl-org/SDL_net/releases/download/release-2.2.0/SDL2_net-2.2.0.dmg
          bash ./tools/dmg_to_framework.sh https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.24.0/SDL2_ttf-2.24.0.dmg
          bash ./tools/dmg_to_framework.sh https://github.com/libsdl-org/SDL_mixer/releases/download/release-2.8.1/SDL2_mixer-2.8.1.dmg

          if [[ "$BUILD_ARGS" != *"NOSERVER"* ]]; then
            cabal update
            cabal v1-install alex zlib --global
            (cd gameServer && cabal v1-install --only-dependencies --force-reinstalls)
          fi
          
          if [[ "$BUILD_ARGS" == *"BUILD_ENGINE_C"* ]]; then
            cabal update
            (cd tools/pas2c && cabal v1-install --only-dependencies)
          fi
          
          # Add to BUILD_ARGS and export to $GITHUB_ENV to persist for future steps
          export BUILD_ARGS="$BUILD_ARGS -DNOAUTOUPDATE=1"
          echo "BUILD_ARGS=$BUILD_ARGS" >> $GITHUB_ENV

      - name: Configure (CMake)
        run: |
          rm cmake_modules/FindOpenGL.cmake
          mkdir build && cd build && cmake -DCMAKE_PREFIX_PATH="/usr/local;/opt/homebrew" $BUILD_ARGS ..

      - name: Build (Make)
        working-directory: ./build
        run: make -j$(sysctl -n hw.ncpu) VERBOSE=1

      - name: Package DMG (macOS)
        if: success()
        working-directory: ./build
        run: make dmg

      - name: Verify App Executable Signature (macOS)
        if: success()
        run: |
          python3 tools/verify_app.py

      - name: Upload macOS DMG Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Hedgewars-macOS-AppleSilicon
          path: build/Hedgewars-*.dmg