# .github/workflows/winbuild-image.yml
#
# Builds the Debian+Wine cross-build image from tools/winbuild/Dockerfile and
# publishes it to GHCR, where windows.yml consumes it.
#
# This is deliberately a separate, rarely-run workflow: the image compiles Qt 6
# from source under Wine and unpacks a full MinGW/Rust toolchain, which takes
# well over half an hour. The per-commit Windows build just pulls the result.
name: Windows build image

on:
  workflow_dispatch:
  push:
    # Only on master: rebuilding the image takes hours, so working on the
    # build scripts in a branch should not keep kicking it off. Use the
    # manual trigger to republish from a branch.
    branches:
      - master
    paths:
      - 'tools/winbuild/**'
      - '.github/workflows/winbuild-image.yml'

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: false

jobs:
  image:
    name: build and publish winbuild image
    runs-on: ubuntu-24.04
    # The Qt build under Wine dominates; 6h is the GitHub per-job ceiling.
    timeout-minutes: 350

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Free disk space
        # A runner starts with ~87GB free, and this job needs room for the Qt
        # source tree and object files, the ~12.7GB image, and BuildKit's cache
        # (~36GB) all at once. windows.yml only pulls the image and needs none
        # of this.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache
          sudo docker image prune --all --force
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: tools/winbuild
          push: true
          # Reuse layers from the previously published image so that editing a
          # step below the Qt build does not recompile Qt.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/hedgewars-winbuild:latest
          cache-to: type=inline
          tags: |
            ghcr.io/${{ github.repository_owner }}/hedgewars-winbuild:latest
            ghcr.io/${{ github.repository_owner }}/hedgewars-winbuild:${{ github.sha }}
